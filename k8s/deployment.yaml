apiVersion: apps/v1
kind: Deployment
metadata:
  name: composer-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: composer-app
  template:
    metadata:
      labels:
        app: composer-app
    spec:
      containers:
      - name: composer-app
        image: 941377131926.dkr.ecr.us-east-1.amazonaws.com/composer-app:latest
        ports:
        - containerPort: 80

